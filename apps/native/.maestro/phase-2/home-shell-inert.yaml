# AC3 (docs/spec/phase-2.md §8): every shell control renders and gives press feedback but does not
# navigate in phase 2. After each tap the shell is still there, unobstructed: no sheet came up over it.
# The avatar is no longer one of them: it opens Settings since phase 3, and sign-out.yaml owns it.
# Nor is the + FAB: it starts a recording since phase 5, and the phase-5 flows own it. Nor is the
# Ask pill: it opens the global chat since phase 7 (docs/spec/phase-7.md §8), and the phase-7 flows
# own it. Nor is the magnifier: it pushes Search since phase 8 (docs/spec/phase-8.md §8), and
# phase-8/search-empty.yaml owns it. Nor is the folder button: it opens the folders drawer since
# phase 9 (docs/spec/phase-9.md §8), and phase-9/folders-empty.yaml owns it. Nor are Get desktop and
# the events card: they open the Get desktop sheet and the work-email upsell since phase 10
# (docs/spec/phase-10.md §8), and phase-10/get-desktop.yaml and phase-10/work-email.yaml own them.
# The phone button stays inert.
appId: ${APP_ID}
name: Home shell controls are inert and do not crash
tags:
  - phase-2
  - regression
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow: ../subflows/open-home.yaml
- tapOn:
    id: home-phone-button
- runFlow: ../subflows/assert-home-unobstructed.yaml
