# From home, open Settings and tap the row ROW, scrolling the list until it shows
# (docs/spec/phase-10.md §8). The caller waits for whatever the row opens.
#
#   - runFlow:
#       file: ../subflows/open-settings-row.yaml
#       env:
#         ROW: settings-report-bug
appId: ${APP_ID}
env:
  APP_ID: com.rovierr.kothanote
---
- runFlow: open-settings.yaml
- scrollUntilVisible:
    element:
      id: ${ROW}
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: ${ROW}
