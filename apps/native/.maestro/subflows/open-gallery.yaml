# Clean launch, then the development-only "Component gallery" link on welcome.
appId: ${APP_ID}
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow: launch-app.yaml
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 180000
- runFlow:
    file: tap-footer-link.yaml
    env:
      TARGET: welcome-dev-gallery
      EXPECT: gallery-screen
      TIMEOUT: "30000"
