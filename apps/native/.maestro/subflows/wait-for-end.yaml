# On the live card: pass the 10 s End threshold (docs/spec/phase-5.md §3.4). The fake recorder's
# hidden skip moves the recorded time on, so the flow does not sit through ten real seconds.
appId: ${APP_ID}
env:
  APP_ID: com.rovierr.kothanote
---
- tapOn:
    id: recording-skip-ahead
- extendedWaitUntil:
    visible:
      id: recording-end
    timeout: 5000
- assertNotVisible:
    id: recording-cancel
