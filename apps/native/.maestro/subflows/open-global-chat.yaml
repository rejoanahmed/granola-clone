# From home, open the global chat (docs/spec/phase-7.md §3.1, #70) and wait for its composer. The
# input autofocuses, so the keyboard rises with the modal; the wait for stillness is what keeps the
# next tap from landing where a control was mid-rise.
appId: ${APP_ID}
env:
  APP_ID: com.rejoan.gcnotes
---
- extendedWaitUntil:
    visible:
      id: home-ask-button
    timeout: 30000
- tapOn:
    id: home-ask-button
- extendedWaitUntil:
    visible:
      id: chat-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
