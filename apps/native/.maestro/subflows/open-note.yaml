# From home, open the seeded note NOTE_ID (docs/spec/phase-4.md §6.7) and wait for its detail.
# The row is waited for first: the list loads after home appears, so a tap taken straight away
# would find no row.
#
#   - runFlow:
#       file: ../subflows/open-note.yaml
#       env:
#         NOTE_ID: not_e2e_standup
appId: ${APP_ID}
env:
  APP_ID: com.rejoan.gcnotes
---
- extendedWaitUntil:
    visible:
      id: home-note-${NOTE_ID}
    timeout: 30000
- tapOn:
    id: home-note-${NOTE_ID}
- extendedWaitUntil:
    visible:
      id: note-screen
    timeout: 15000
