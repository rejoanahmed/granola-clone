# Reset and seeded backend, then a clean launch signed in as the seeded, onboarded `person`
# (docs/spec/phase-3.md AC8). Phase 4 generalised it into `open-home-as.yaml`; this stays as the
# name every earlier flow already calls. MIC passes through (phase 5; see launch-app.yaml).
appId: ${APP_ID}
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow:
    file: open-home-as.yaml
    env:
      ROLE: person
      MIC: "${typeof MIC === 'undefined' ? 'allow' : MIC}"
