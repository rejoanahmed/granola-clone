# Start the app from nothing: no stored session, no dev-launcher history.
#
# `clearKeychain` as well as `clearState`: the session cookie lives in SecureStore, which on iOS is
# the Keychain, and the Keychain survives `clearState` — without it a "fresh" launch is signed in.
#
# A Debug build is a dev client with no JavaScript inside it, so a clean launch would show the dev
# launcher rather than the app. Two launch arguments, both read by expo-dev-client itself, get past
# it — and past the dev menu — without touching a screen that is not ours:
#   --initialUrl                   the dev launcher loads this Metro URL straight away. A deep link
#                                  (`gcnotes://expo-development-client/?url=…`) does the same but
#                                  raises iOS's "Open in Notes?" sheet, which has no testID.
#   -EXDevMenu…                    user defaults, set for this launch only: without them the dev
#                                  menu's first-run sheet, then the menu itself, then its floating
#                                  button cover the app on every clean launch.
# All are inert in a Release build, which has neither the launcher nor the menu.
#
# MIC is the microphone permission the app launches with (docs/spec/phase-5.md §8): `allow` (the
# default, and what Maestro grants without being asked), `deny`, or `unset` for the undetermined
# state the primer card is for. It defaults in the expression, for the reason below. `all: allow`
# first keeps every other permission where Maestro's own default puts it.
#
# E2E_SESSION is a Set-Cookie header for a session the harness minted, which a development build
# adopts before its first render (`subflows/sign-in-fast.yaml`, `apps/native/src/lib/e2e-session.ts`).
# Empty by default, which the app reads as none: a clean launch is signed out.
#
# The Metro URL defaults in the expression rather than in `env:`: a subflow's own `env:` default
# wins over `-e DEV_SERVER_URL=…` from the command line, so a second Metro on another port (another
# project already holding :8081) was silently ignored and the app loaded the wrong bundle.
appId: ${APP_ID}
env:
  APP_ID: com.rejoan.gcnotes
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
      microphone: "${typeof MIC === 'undefined' ? 'allow' : MIC}"
    arguments:
      --initialUrl: "${typeof DEV_SERVER_URL === 'undefined' ? 'http://localhost:8081' : DEV_SERVER_URL}"
      -EXDevMenuIsOnboardingFinished: "YES"
      -EXDevMenuShowsAtLaunch: "NO"
      -EXDevMenuShowFloatingActionButton: "NO"
      -gcE2eSession: "${typeof E2E_SESSION === 'undefined' ? '' : E2E_SESSION}"
