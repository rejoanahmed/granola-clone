# AC9 (docs/spec/phase-5.md §8, §3.7): Minimize goes home, where the recording pill stands in for
# the + FAB and the new "Untitled note" row is listed with its live (lime waveform) tile. The pill,
# and then the row, bring the live card back with the typed notes intact; once the recording ends,
# the FAB returns and the row is an ordinary one.
appId: ${APP_ID}
name: Minimising a recording and returning to it
tags:
  - phase-5
  - regression
env:
  APP_ID: com.rovierr.kothanote
---
- runFlow: ../subflows/open-home.yaml
- runFlow: ../subflows/start-recording.yaml
- tapOn:
    id: recording-notes-input
- inputText: Kept across minimise
- tapOn:
    id: recording-keyboard-dismiss
- extendedWaitUntil:
    visible:
      id: recording-bar
    timeout: 10000

- tapOn:
    id: recording-minimize
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: home-recording-pill
      text: Return to recording
    timeout: 10000
- assertNotVisible:
    id: home-new-note-button
- assertNotVisible:
    id: recording-screen
- extendedWaitUntil:
    visible:
      id: "home-note-(?!not_e2e_).*"
      text: "Untitled note, .*, recording"
    timeout: 15000

- tapOn:
    id: home-recording-pill
- extendedWaitUntil:
    visible:
      id: recording-screen
    timeout: 15000
- assertVisible:
    id: recording-notes-input
    text: Kept across minimise

# The live row reopens the card too, not only the pill.
- tapOn:
    id: recording-minimize
- extendedWaitUntil:
    visible:
      id: home-recording-pill
    timeout: 15000
- tapOn:
    id: "home-note-(?!not_e2e_).*"
    text: "Untitled note, .*, recording"
- extendedWaitUntil:
    visible:
      id: recording-screen
    timeout: 15000
- assertVisible:
    id: recording-notes-input
    text: Kept across minimise

- runFlow: ../subflows/wait-for-end.yaml
- tapOn:
    id: recording-end
- extendedWaitUntil:
    visible:
      id: note-screen
    timeout: 15000
- tapOn:
    id: note-back
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: home-new-note-button
    timeout: 10000
- assertNotVisible:
    id: home-recording-pill
- assertNotVisible:
    text: "Untitled note, .*, recording"
