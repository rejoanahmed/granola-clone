# AC9 (docs/spec/phase-5.md §8, §3.7): Minimize goes home, where the recording pill stands in for
# the + FAB and the new "Untitled note" row is listed. The pill brings the live card back with the
# typed notes intact; once the recording ends, the FAB returns.
appId: ${APP_ID}
name: Minimising a recording and returning to it
tags:
  - phase-5
  - regression
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow: ../subflows/open-home.yaml
- runFlow: ../subflows/start-recording.yaml
- tapOn:
    id: recording-notes-input
- inputText: Kept across minimise
- tapOn:
    id: recording-keyboard-dismiss
- extendedWaitUntil:
    visible:
      id: recording-bar
    timeout: 10000

- tapOn:
    id: recording-minimize
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: home-recording-pill
    timeout: 10000
- assertNotVisible:
    id: home-new-note-button
- assertNotVisible:
    id: recording-screen
- extendedWaitUntil:
    visible:
      id: "home-note-(?!not_e2e_).*"
      text: "Untitled note, .*"
    timeout: 15000

- tapOn:
    id: home-recording-pill
- extendedWaitUntil:
    visible:
      id: recording-screen
    timeout: 15000
- assertVisible:
    id: recording-notes-input
    text: Kept across minimise

- runFlow: ../subflows/wait-for-end.yaml
- tapOn:
    id: recording-end
- extendedWaitUntil:
    visible:
      id: note-screen
    timeout: 15000
- tapOn:
    id: note-back
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: home-new-note-button
    timeout: 10000
- assertNotVisible:
    id: home-recording-pill
