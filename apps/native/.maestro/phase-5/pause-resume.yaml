# AC8 (docs/spec/phase-5.md §8, §3.4): Pause swaps the meter for "Paused" and holds the timer;
# tapping it again brings the meter back and the timer counts on.
appId: ${APP_ID}
name: Pausing and resuming a recording
tags:
  - phase-5
  - regression
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow: ../subflows/open-home.yaml
- runFlow: ../subflows/start-recording.yaml
- extendedWaitUntil:
    visible:
      id: recording-meter
    timeout: 10000
- assertNotVisible:
    id: recording-paused

- tapOn:
    id: recording-pause
- extendedWaitUntil:
    visible:
      id: recording-paused
      text: Paused
    timeout: 5000
- assertNotVisible:
    id: recording-meter
# The timer holds while paused: the wait gives a counting timer 2.5 s to change its text, and returns
# early if it does; the assertion after it then fails.
- copyTextFrom:
    id: recording-timer
- extendedWaitUntil:
    notVisible:
      id: recording-timer
      text: ${maestro.copiedText}
    timeout: 2500
    optional: true
- assertVisible:
    id: recording-timer
    text: ${maestro.copiedText}

- tapOn:
    id: recording-pause
- extendedWaitUntil:
    visible:
      id: recording-meter
    timeout: 5000
- assertNotVisible:
    id: recording-paused
# Resumed, it counts on from where it held.
- extendedWaitUntil:
    notVisible:
      id: recording-timer
      text: ${maestro.copiedText}
    timeout: 5000
