# Tagged `unfinished` (D027): it drives an entry point a release build hides. It runs only against a
# bundle started with EXPO_PUBLIC_SHOW_UNFINISHED=true (scripts/maestro.sh includes the tag then).
# AC6 (docs/spec/phase-11.md §8, §3.1; phase-9.md §3.2): a folder view shows no events card in any
# state — a calendar is not about a folder — and My notes brings the populated card back.
appId: ${APP_ID}
name: The events card is hidden in a folder view
tags:
  - unfinished
  - phase-11
  - regression
env:
  APP_ID: com.rovierr.kothanote
---
- runFlow: ../subflows/open-home.yaml
- runFlow: ../subflows/seed-folders.yaml
- runFlow:
    file: ../subflows/seed-calendar.yaml
    env:
      PRESET: standard
- extendedWaitUntil:
    visible:
      id: home-events-list
    timeout: 15000
- runFlow:
    file: ../subflows/filter-by-folder.yaml
    env:
      FOLDER_ID: fld_e2e_personal
      NAME: Personal
- extendedWaitUntil:
    visible:
      id: home-note-not_e2e_solo
    timeout: 15000
- assertNotVisible:
    id: home-events-list
- assertNotVisible:
    id: home-events-card
- assertNotVisible:
    id: home-events-loading
- assertNotVisible:
    id: home-events-error

- runFlow: ../subflows/open-folders.yaml
- tapOn:
    id: folders-all
- extendedWaitUntil:
    notVisible:
      id: folders-drawer
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: home-title
      text: My notes
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: home-events-list
    timeout: 15000
- assertVisible:
    id: home-event-cev_e2e_person_1
