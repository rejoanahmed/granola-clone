# AC1 (docs/spec/phase-8.md §8, #60, #62): the magnifier pushes Search with the keyboard already up,
# the toggle follows the keyboard both ways, and Back returns home.
appId: ${APP_ID}
name: Search opens empty with the keyboard up
tags:
  - phase-8
  - regression
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow: ../subflows/open-home.yaml
- runFlow: ../subflows/open-search.yaml
- assertVisible:
    id: search-back
- assertVisible:
    id: search-empty-title
    text: Search your notes
- assertVisible:
    id: search-empty-subtitle
    text: Search by title, notes, or people.
- assertNotVisible:
    id: search-clear
- extendedWaitUntil:
    visible:
      id: search-keyboard-toggle
      text: Hide keyboard
    timeout: 5000
- takeScreenshot: phase-8-search-empty
- tapOn:
    id: search-keyboard-toggle
- extendedWaitUntil:
    visible:
      id: search-keyboard-toggle
      text: Show keyboard
    timeout: 5000
- tapOn:
    id: search-keyboard-toggle
- extendedWaitUntil:
    visible:
      id: search-keyboard-toggle
      text: Hide keyboard
    timeout: 5000
- tapOn:
    id: search-back
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
