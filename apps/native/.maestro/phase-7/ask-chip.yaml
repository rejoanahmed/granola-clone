# AC2 (docs/spec/phase-7.md §8, #70): a suggestion chip sends itself, with no typing. The seeded
# person's notes hold nothing about promises or follow-ups, so retrieval falls back to the three
# most recent notes and the answer cites all three (§6.6).
appId: ${APP_ID}
name: A suggestion chip sends immediately
tags:
  - phase-7
  - regression
env:
  APP_ID: com.rovierr.kothanote
---
- runFlow: ../subflows/open-home.yaml
- runFlow: ../subflows/open-global-chat.yaml
- tapOn:
    id: chat-chip-0
- runFlow:
    file: ../subflows/wait-for-answer.yaml
    env:
      N: "0"
- assertNotVisible:
    id: chat-chips
- assertVisible:
    id: chat-answer-0-cite-1
- assertVisible:
    id: chat-answer-0-cite-2
- assertVisible:
    id: chat-answer-0-cite-3
- assertVisible:
    id: chat-title
    text: Who have I promised to follow up with
# The thread follows the bottom while the answer streams (§3.1 State B). With the keyboard up the
# fallback answer is taller than the thread, so the question bubble sits above the top and the
# thread is scrolled back to it.
- repeat:
    times: 3
    while:
      notVisible:
        id: chat-user-0
    commands:
      - swipe:
          from:
            id: chat-thread
          direction: DOWN
- extendedWaitUntil:
    visible:
      id: chat-user-0
      text: Who have I promised to follow up with\?
    timeout: 5000
