# AC8 (docs/spec/phase-4.md §8, §3.1): a person with no notes sees the designed empty state inside
# the list, with the phase-2 header band and the floating bar still there.
appId: ${APP_ID}
name: The empty list
tags:
  - phase-4
  - regression
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow:
    file: ../subflows/open-home-as.yaml
    env:
      ROLE: empty
- extendedWaitUntil:
    visible:
      id: home-empty
    timeout: 30000
- assertVisible:
    id: home-empty-title
    text: No notes yet
# Since phase 11 the empty card appears only once the calendar has answered (phase-11.md §8).
- extendedWaitUntil:
    visible:
      id: home-events-card
    timeout: 10000
- assertVisible:
    id: home-events-card
- assertVisible:
    id: home-list
- assertVisible:
    id: home-ask-button
- assertVisible:
    id: home-new-note-button
- assertNotVisible:
    id: "home-day-.*"
- assertNotVisible:
    id: "home-note-.*"
- takeScreenshot: phase-4-empty
