# Tagged `unfinished` (D027): it drives an entry point a release build hides. It runs only against a
# bundle started with EXPO_PUBLIC_SHOW_UNFINISHED=true (scripts/maestro.sh includes the tag then).
# AC4, the phase-10 exit (docs/spec/phase-10.md §8, #85): the Upcoming meetings toggle is on by
# default, turns off, stays off across a relaunch because it is stored server-side, and turns back
# on. Each tap is waited out until the toggle is enabled again (§3: disabled while its own request
# is in flight), so the relaunch never interrupts a save.
appId: ${APP_ID}
name: A notifications toggle persists across a relaunch
tags:
  - unfinished
  - phase-10
  - regression
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow: ../subflows/open-home.yaml
- runFlow:
    file: ../subflows/open-settings-row.yaml
    env:
      ROW: settings-notifications
- extendedWaitUntil:
    visible:
      id: notifications-screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: notifications-upcoming-toggle
      selected: true
    timeout: 10000
- assertVisible:
    id: notifications-upcoming-row
- assertVisible:
    id: notifications-preview
- takeScreenshot: phase-10-notifications

- tapOn:
    id: notifications-upcoming-toggle
- extendedWaitUntil:
    visible:
      id: notifications-upcoming-toggle
      selected: false
      enabled: true
    timeout: 10000

- runFlow: ../subflows/relaunch-app.yaml
- runFlow: ../subflows/wait-for-home.yaml
- runFlow:
    file: ../subflows/open-settings-row.yaml
    env:
      ROW: settings-notifications
- extendedWaitUntil:
    visible:
      id: notifications-screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: notifications-upcoming-toggle
      selected: false
    timeout: 10000

- tapOn:
    id: notifications-upcoming-toggle
- extendedWaitUntil:
    visible:
      id: notifications-upcoming-toggle
      selected: true
      enabled: true
    timeout: 10000
- tapOn:
    id: notifications-back
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
- tapOn:
    id: settings-notifications
- extendedWaitUntil:
    visible:
      id: notifications-screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: notifications-upcoming-toggle
      selected: true
    timeout: 10000
