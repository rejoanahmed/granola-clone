# AC1 (docs/spec/phase-10.md §8, #80, #81), as a release build draws it since phase 13 (D027):
# Account with Profile, Support with feedback, bug report, help and the privacy policy, then Sign
# out and the version. The desktop banner, Notifications, Subscription, the Features section,
# Share, Recover and Data & sharing are hidden; the full list is phase-12/parity-settings.yaml,
# tagged `unfinished`.
appId: ${APP_ID}
name: The settings list and its sections
tags:
  - phase-10
  - regression
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow: ../subflows/open-home.yaml
- runFlow: ../subflows/open-settings.yaml
- assertVisible:
    id: settings-section-account
- assertVisible:
    id: settings-profile
- assertNotVisible:
    id: settings-desktop-banner
- assertNotVisible:
    id: settings-notifications
- assertNotVisible:
    id: settings-subscription
- assertNotVisible:
    id: settings-section-features
- takeScreenshot: phase-10-settings-top

- scrollUntilVisible:
    element:
      id: settings-feedback
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: settings-section-support
- scrollUntilVisible:
    element:
      id: settings-report-bug
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: settings-help
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: settings-privacy
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: settings-share-app
- assertNotVisible:
    id: settings-recover

- scrollUntilVisible:
    element:
      id: settings-version
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: settings-section-data
- assertNotVisible:
    id: settings-use-my-data
- assertVisible:
    id: settings-sign-out
- assertVisible:
    id: settings-version
    text: "1\\.0\\.0 \\(1\\)"
- takeScreenshot: phase-10-settings-bottom
