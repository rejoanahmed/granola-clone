# AC6 (docs/spec/phase-10.md §8, #90): Report a bug opens with Send disabled and diagnostics on; a
# blank message keeps Send disabled; a sent report closes the sheet with a toast and reaches the
# fake Email port's outbox; the next open starts empty; Close returns to Settings.
#
# The message is typed first and Diagnostics switched off after, with the keyboard still up (§8's
# order): the form is keyboard-aware since phase 12 (docs/spec/phase-12.md §6.2), so the card
# scrolls clear of the keyboard and takes the tap.
appId: ${APP_ID}
name: Report a bug through the fake email port
tags:
  - phase-10
  - regression
env:
  APP_ID: com.rovierr.kothanote
---
- runFlow: ../subflows/open-home.yaml
- runFlow:
    file: ../subflows/open-settings-row.yaml
    env:
      ROW: settings-report-bug
- extendedWaitUntil:
    visible:
      id: report-bug-sheet
    timeout: 10000
- assertVisible:
    id: report-bug-send
    enabled: false
- assertVisible:
    id: report-bug-message-card
- assertVisible:
    id: report-bug-diagnostics
    selected: true
- takeScreenshot: phase-10-report-bug

- tapOn:
    id: report-bug-message
- inputText: "   "
- assertVisible:
    id: report-bug-send
    enabled: false
- eraseText: 10
- inputText: "Steps: tapped Share twice"
- extendedWaitUntil:
    visible:
      id: report-bug-send
      enabled: true
    timeout: 5000
- scrollUntilVisible:
    element:
      id: report-bug-diagnostics
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: report-bug-diagnostics
- extendedWaitUntil:
    visible:
      id: report-bug-diagnostics
      selected: false
    timeout: 5000
- tapOn:
    id: report-bug-send
- extendedWaitUntil:
    notVisible:
      id: report-bug-sheet
    timeout: 15000
- assertVisible:
    id: settings-screen
- extendedWaitUntil:
    visible:
      id: toast-message
      text: Thanks — your report was sent\.
    timeout: 10000
- runScript:
    file: ../scripts/e2e-support.js
    env:
      KIND: bug-report
      EXPECT_SUBJECT: "Bug report from Kothanote 1.0.0 (1) | e2e-person@kothanote.test"
      EXPECT_BODY: "Diagnostics: not included"

# The draft is not kept (§3.8): a second open starts from the placeholder.
- tapOn:
    id: settings-report-bug
- extendedWaitUntil:
    visible:
      id: report-bug-sheet
    timeout: 10000
# An empty iOS field reports its placeholder (after its label) as its text, so this is "empty",
# not "not yet drawn".
- assertVisible:
    id: report-bug-message
    text: "Describe the bug Steps:\\s+Expected:\\s+Actual:\\s+Attempts to fix:"
- assertVisible:
    id: report-bug-diagnostics
    selected: true
- assertVisible:
    id: report-bug-send
    enabled: false
- tapOn:
    id: report-bug-close
- extendedWaitUntil:
    notVisible:
      id: report-bug-sheet
    timeout: 10000
- assertVisible:
    id: settings-screen
