# AC12 (docs/spec/phase-10.md §8, #87, #88): Phone calls and Watch are static pages. Get Started
# answers with a coming-soon toast (designed); Watch says no watch was found; Back returns to
# Settings from each.
appId: ${APP_ID}
name: The Phone calls and Watch pages
tags:
  - phase-10
  - regression
env:
  APP_ID: com.rejoan.gcnotes
---
- runFlow: ../subflows/open-home.yaml
- runFlow:
    file: ../subflows/open-settings-row.yaml
    env:
      ROW: settings-phone-calls
- extendedWaitUntil:
    visible:
      id: phone-calls-screen
    timeout: 10000
- assertVisible:
    id: phone-calls-title
    text: Make Calls From Notes
- assertVisible:
    id: phone-calls-get-started
- takeScreenshot: phase-10-phone-calls
- tapOn:
    id: phone-calls-get-started
- extendedWaitUntil:
    visible:
      id: toast-message
      text: Phone calls are coming soon\.
    timeout: 10000
# Let it go before leaving, or it rides over onto the Watch page and its #88 screenshot.
- extendedWaitUntil:
    notVisible:
      id: toast-message
    timeout: 10000
- tapOn:
    id: phone-calls-back
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000

- scrollUntilVisible:
    element:
      id: settings-watch
    direction: DOWN
    timeout: 20000
- tapOn:
    id: settings-watch
- extendedWaitUntil:
    visible:
      id: watch-screen
    timeout: 10000
- assertVisible:
    id: watch-title
    text: Apple Watch
- assertVisible:
    id: watch-status
    text: No Apple Watch found
- assertVisible:
    id: watch-info
    text: Pair an Apple Watch with this iPhone to use Notes from your wrist\.
- takeScreenshot: phase-10-watch
- tapOn:
    id: watch-back
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 10000
