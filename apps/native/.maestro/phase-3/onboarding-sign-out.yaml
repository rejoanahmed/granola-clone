# AC7 (docs/spec/phase-3.md §8): step 1 has no Back, so "Not you? Sign out" is the way out for
# somebody who typed the wrong address — and it signs out for real, across a relaunch.
appId: ${APP_ID}
name: Not you? Sign out leaves onboarding for welcome
tags:
  - phase-3
  - regression
env:
  APP_ID: com.rovierr.kothanote
---
- runFlow: ../subflows/start-clean.yaml
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: e2e-newcomer@kothanote.test
- extendedWaitUntil:
    visible:
      id: onboarding-name-screen
    timeout: 30000
- runFlow:
    file: ../subflows/tap-footer-link.yaml
    env:
      TARGET: onboarding-sign-out
      EXPECT: welcome-screen
      TIMEOUT: "30000"

- runFlow: ../subflows/relaunch-app.yaml
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 180000
- assertNotVisible:
    id: onboarding-name-screen
